<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathScope</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<section class="panel" id="panel" aria-label="MathScope panel">
  <div class="panel-head">
    <span class="name">MathScope</span>
    <span class="adapter" id="ms-status"></span>
    <button type="button" class="close" id="ms-close" aria-label="Close MathScope">Close</button>
  </div>
  <nav class="trail" id="ms-trail" aria-label="Operators applied" hidden></nav>
  <div class="eq-render" id="ms-eq-render"></div>
  <fieldset class="group" id="ms-views-group" hidden>
    <legend>In this formula</legend>
    <div class="chips" id="ms-views"></div>
  </fieldset>
  <p class="msg" id="ms-msg">Click an outlined equation on the page.</p>

  <div class="work" id="ms-work" hidden>
    <div class="stack" id="ms-axes"></div>

    <div class="group" id="ms-params-group">
      <span class="label">Parameters</span>
      <div class="params" id="ms-params"></div>
      <p class="small" id="ms-params-note"></p>
    </div>

    <div class="group">
      <div class="controls" id="ms-options"></div>
      <div class="legend" id="ms-legend"></div>
      <p class="readout" id="ms-readout"></p>
      <div class="plot" id="ms-plot"><canvas id="ms-canvas" role="img" aria-label="Plot of the selected equation"></canvas><canvas id="ms-canvas3d" role="img" aria-label="Three-dimensional view" hidden></canvas></div>
    </div>

    <p class="numbers" id="ms-numbers" hidden></p>

    <div class="group" id="ms-ops-group">
      <span class="label">Apply an operator</span>
      <div class="ops" id="ms-ops"></div>
      <p class="small" id="ms-op-note"></p>
    </div>

    <div class="deriv" id="ms-deriv-box">
      <span class="cap" id="ms-deriv-cap">Derivative</span>
      <div id="ms-deriv"></div>
    </div>

    <details id="ms-table-box">
      <summary>Values table</summary>
      <div class="tablewrap"><table id="ms-table"></table></div>
    </details>
  </div>

  <details id="ms-dev">
    <summary>What the extension extracted</summary>
    <div class="kv">
      <div><span class="k">TeX source, read from the page</span><pre id="ms-src"></pre></div>
      <div><span class="k">Parsed expression (MathJSON)</span><pre id="ms-json"></pre></div>
      <div><span class="k">What is being drawn</span><pre id="ms-ir"></pre></div>
    </div>
  </details>
</section>
<script src="vendor/katex/katex.min.js"></script>
<script type="module" src="panel.js"></script>
</body>
</html>
